<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Almacén - Shalom</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:16px;background:#fff;color:#000}
  .wrap{max-width:420px;margin:0 auto}
  .logo{font-size:44px;font-weight:900;font-style:italic;letter-spacing:2px;text-align:center;margin:8px 0 4px}
  .logo sup{font-size:12px;font-style:normal;font-weight:400}
  .fecha{text-align:center;font-size:14px;margin:0 0 16px;color:#333;text-transform:capitalize}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid #000;padding:8px;text-align:center;font-weight:700}
  th{background:#000;color:#fff;font-style:italic;font-size:22px;font-weight:400;text-align:left}
  .l{text-align:left}
  .num{font-family:Georgia,serif;font-size:18px}
  td.v{height:34px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SHALOM<sup>®</sup></div>
  <p class="fecha" id="fecha"></p>
  <table>
    <tr><th colspan="6">CONTROL ALMACEN</th></tr>
    <tr>
      <td class="l">CANT.</td>
      <td>&#9745;</td>
      <td class="l" colspan="4">ZONA</td>
    </tr>
    <tr>
      <td class="v"></td><td></td>
      <td class="num">0</td><td class="num">1</td><td class="num">2</td><td class="num">3</td>
    </tr>
    <tr>
      <td class="v"></td><td></td>
      <td>5</td>
      <td colspan="3">INC.</td>
    </tr>
  </table>
</div>
<script>
  // Fecha automática del día (hora de Lima)
  var hoy = new Date().toLocaleDateString('es-PE', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    timeZone: 'America/Lima'
  });
  document.getElementById('fecha').textContent = 'Fecha: ' + hoy;
</script>
</body>
</html>
